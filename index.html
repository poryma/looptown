function makeTown(seed){
  const res=[],adj=[];
  for(let r=0;r<4;r++)for(let c=0;c<10;c++){ const i=r*10+c; res.push({i,x:12+c*30+(r%2?7:0),y:37+r*35,kind:((c*7+r*3)%5<2)?'peach':'mint',name:NAMES[i],E:{},clk:{},bel:false,fl:-9999,flc:null,ph:(i*1.7)%6.28,show:null}); adj.push([]); }
  const link=(a,b)=>{ if(a===b||adj[a].includes(b))return; adj[a].push(b); adj[b].push(a); };
  for(let r=0;r<4;r++)for(let c=0;c<10;c++){ const i=r*10+c; if(c<9)link(i,i+1); if(r<3)link(i,i+10); }
  for(let i=0;i<40;i+=3) link(i,(i*17+11)%40);
  const links=[]; adj.forEach((a,i)=>a.forEach(j=>{ if(j>i) links.push([i,j]); }));
  const T={res,adj,links,day:0,clicks:{},pending:[],hist:[],seed:(seed!=null?seed:(Math.random()*1e9|0))};
  return T;
}
function townStats(T){ const n=T.res.length; return {heard:pct(T.res.filter(r=>r.E.R>0).length,n),bel:pct(T.res.filter(r=>r.bel).length,n),sawC:pct(T.res.filter(r=>r.E.C>0).length,n)}; }
function seedRumor(T){ for(const i of [13,26]){ const r=T.res[i]; r.E.R=1; r.clk.R=1; T.pending.push([r,POST.R]); } T.clicks.R=2; T.hist=[townStats(T)]; }
function townDay(T,P){
  T.day++; const out=[]; const now=performance.now();
  const PC={R:1,T:2,C:3}; const ex=(r,p)=>{ r.E[p.id]=(r.E[p.id]||0)+1; r.fl=now; r.flc=p.id; if(!r.clk[p.id] && hr(T.seed,0,r.i,20+PC[p.id])<p.click){ r.clk[p.id]=1; T.clicks[p.id]=(T.clicks[p.id]||0)+1; out.push([r,p]); } };
  const sp=P.shareP*(P.friction?0.4:1);
  for(const [r,p] of T.pending) for(const j of T.adj[r.i]) if(hr(T.seed,T.day,r.i*64+j,PC[p.id])<sp) ex(T.res[j],p);
  for(const p of P.posts){
    if((p.from||1)>T.day) continue;
    const boost=Math.min(1,(1+(T.clicks[p.id]||0))/P.ramp);
    let reach=P.base*(P.w*boost*(p.click/0.35)+(1-P.w)*p.acc);
    if(P.pin && p.id==='C') reach=Math.max(reach,0.5);
    for(const r of T.res){ const seen=(r.E[p.id]||0)>0; if(seen && !P.repeat) continue; if(hr(T.seed,T.day,r.i,10+PC[p.id])<reach*(seen?0.7:1)) ex(r,p); }
  }
  T.pending=out;
  for(const r of T.res){ if(!r.bel && (r.E.R||0)>=3 && !(r.E.C>0)) r.bel=true; }
  T.hist.push(townStats(T));
}
function topPost(T,P){ const ps=P.posts.filter(p=>(p.from||1)<=Math.max(1,T.day)); let best=null,bs=-1; for(const p of ps){ const boost=Math.min(1,(1+(T.clicks[p.id]||0))/P.ramp); const s=P.w*boost*(p.click/0.35)+(1-P.w)*p.acc+(P.pin&&p.id==='C'?5:0); if(s>bs){bs=s;best=p;} } return best; }
function drawTown(T,o={}){
  townBG(); const t=performance.now();
  if(o.links) for(const [a,b] of T.links){ const A=T.res[a],B=T.res[b]; const hot=(A.E.R>0&&B.E.R>0); line(A.x+4,A.y+4,B.x+4,B.y+4,hot?'#c77ab8':'#76bb70'); }
  billboard(o.head,o.day);
  for(const r of T.res){
    const fresh=t-r.fl<450;
    blob(r.x,r.y,r.kind,{bob:t/320+r.ph,bel:r.bel,jump:fresh});
    const bx=r.x+1,by=r.y-11;
    if(o.mode==='hello'){ if(r.show) bubble(bx,by,'v','#fff8ef','#e8204e'); }
    else if(o.mode==='clicks'){ if(r.show==='R') bubble(bx,by,'!','#ff77a8','#1d2b53'); else if(r.show==='T') bubble(bx,by,'v','#fff8ef','#008751'); }
    else if(o.counts){ const c=r.E.R||0; if(c>0) bubble(bx,by,String(Math.min(c,9)),r.bel?'#7e2553':'#fff8ef',r.bel?'#fff8ef':'#7e2553'); }
    else if(r.bel) bubble(bx,by,'!','#7e2553','#fff8ef');
    else if(r.E.R>0) bubble(bx,by,'!','#fff8ef','#7e2553');
    else if(r.E.C>0||r.E.T>0) bubble(bx,by,'v','#fff8ef','#008751');
    if(fresh){ const c=r.flc==='R'?'#ff77a8':'#00c060'; px(r.x-2,r.y-1,1,1,c); px(r.x+10,r.y-1,1,1,c); px(r.x-2,r.y+9,1,1,c); px(r.x+10,r.y+9,1,1,c); }
  }
}

  why:{ko:'같은 조건으로 보여 줘도 소문이 약 3배 더 클릭됩니다. 클릭만 보는 규칙에서는 소문이 이깁니다.',zh:'即使展示条件相同，谣言的点击也约是消息的3倍。只看点击的规则下，谣言胜出。',en:'Shown equally, the rumor gets about three times the clicks. Under a clicks-only rule, the rumor wins.'}},

function rumorRun(s,P,days,label,color,after){
  s.T=makeTown(s.seed); seedRumor(s.T); s.P=P; const ser={data:[s.T.hist[0][s.metric||'heard']],color,label};
  s.series.push(ser); if(s.series.length>3) s.series.shift();
  play(days,420,()=>{ townDay(s.T,P); ser.data.push(s.T.hist[s.T.hist.length-1][s.metric||'heard']); },()=>after&&after(ser));
}
S({ch:0,
 title:{ko:'다이얼을 돌려라',zh:'转动旋钮',en:'Turn the Dial'},
 story:{ko:'이제 <b>여러분</b>이 버즈를 설계합니다. 다이얼은 순위를 매길 때 <b>클릭</b>과 <b>정확성</b> 중 무엇을 얼마나 중시할지 정합니다. 100%면 클릭만, 0%면 정확성만 봅니다. 순위가 높은 글은 더 많은 사람에게 보이고, 사람들은 클릭한 글을 이웃에게 공유합니다.',
        zh:'现在由<b>你</b>来设计 Buzz。旋钮决定排序时<b>点击</b>与<b>准确性</b>各占多少比重。100% 表示只看点击，0% 表示只看准确性。排名越高的帖子被越多人看到，人们还会把点过的帖子分享给邻居。',
        en:'Now <b>you</b> design Buzz. The dial sets how much the ranking cares about <b>clicks</b> versus <b>accuracy</b>. At 100%, only clicks count; at 0%, only accuracy counts. Top-ranked posts reach more people, and people share what they click with their neighbors.'},
 task:{ko:'클릭 비중 80% 이상으로 한 번, 30% 이하로 한 번, 각각 6일씩 실행해 두 선을 비교하세요.',zh:'点击比重≥80% 运行一次，≤30% 再运行一次，各6天，比较两条线。',en:'Run 6 days twice: once with clicks at 80% or more, once at 30% or less. Compare the lines.'},
 init(s){ s.w=1; s.series=[]; s.runs=[]; s.seed=Math.random()*1e9|0; s.T=makeTown(s.seed); seedRumor(s.T); s.P={w:1,posts:[POST.R,POST.T],base:.35,ramp:10,shareP:.45,repeat:true}; },
 ui(s,box){
  box.appendChild(slider({ko:'순위에서 클릭 비중',zh:'排序中点击的比重',en:'Weight on clicks in the ranking'},0,1,.1,s.w,v=>Math.round(v*100)+'%',v=>s.w=v,[{ko:'정확성만',zh:'只看准确性',en:'accuracy only'},{ko:'클릭만',zh:'只看点击',en:'clicks only'}]));
  box.appendChild(row(btn({ko:'6일 실행',zh:'运行6天',en:'Run 6 days'},()=>{ const w=s.w; rumorRun(s,{w,posts:[POST.R,POST.T],base:.35,ramp:10,shareP:.45,repeat:true},6,{ko:`클릭 ${Math.round(w*100)}%`,zh:`点击 ${Math.round(w*100)}%`,en:`clicks ${Math.round(w*100)}%`},COLORS[s.runs.length%5],ser=>{ s.runs.push({w,heard:ser.data[ser.data.length-1]}); }); })));
 },

 chart(s){ chartLine({series:s.series,xMax:6}); legend(s.series.map(x=>({color:x.color,label:{ko:x.label.ko+' · 소문 들은 비율',zh:x.label.zh+' · 听过谣言的比例',en:x.label.en+' · heard rumor'}}))); },

 done(s){ return s.runs.some(r=>r.w>=.8)&&s.runs.some(r=>r.w<=.3); },
 quiz:{q:{ko:'클릭 비중을 낮추자 소문은 어떻게 되었나요?',zh:'降低点击比重后，谣言怎么样了？',en:'When you lowered the weight on clicks, what happened to the rumor?'},
  opts:[{ko:'더 많은 사람에게 퍼졌다',zh:'传给了更多人',en:'It reached more people'},{ko:'아무런 변화가 없었다',zh:'完全没有变化',en:'Nothing changed at all'},{ko:'더 적은 사람에게 퍼졌다',zh:'传给了更少的人',en:'It reached fewer people'},{ko:'버즈에서 아예 삭제되었다',zh:'被 Buzz 删除了',en:'It was deleted from Buzz'}],a:2,
  why:{ko:'소문은 지워지지 않았습니다. 순위가 내려가 덜 보였을 뿐입니다. 이웃 공유로는 여전히 퍼집니다.',zh:'谣言没有被删除，只是排名下降、曝光减少。它仍会通过邻居分享传播。',en:'The rumor was not deleted. It just ranked lower and was seen less. It still spreads through neighbors.'}},
 key:{ko:'시스템이 무엇을 최적화할지는 사람이 내린 <b>설계 선택</b>입니다. “알고리즘이 그랬다”는 말은 다이얼을 누가 맞췄는지를 가립니다.',zh:'系统优化什么，是人做出的<b>设计选择</b>。“是算法干的”这句话，掩盖了是谁拧的旋钮。',en:'What a system optimizes is a <b>design choice</b> made by people. “The algorithm did it” hides who set the dial.'}
});

S({ch:0,

function makeSplit(){ const N=[],So=[]; for(let i=0;i<16;i++){ N.push({x:16+(i%8)*37+(i>=8?14:0),y:i<8?30:60,kind:'mint',ph:i}); So.push({x:16+(i%8)*37+(i>=8?14:0),y:i<8?112:144,kind:'peach',ph:i+3}); } return {N,S:So,bots:[],marks:[]}; }
function setBots(W,nS){ const want=[...Array(10)].map((_,i)=>i<nS?'S':'N'); while(W.bots.length<10) W.bots.push({x:150,y:90,tx:150,ty:90,side:'N'}); W.bots.forEach((b,i)=>{ b.side=want[i]; }); }
function stepBots(W){ for(const b of W.bots){ const yr=b.side==='N'?[26,74]:[108,160]; if(b.ty<yr[0]||b.ty>yr[1]||Math.hypot(b.tx-b.x,b.ty-b.y)<2){ b.tx=10+rnd()*290; b.ty=yr[0]+rnd()*(yr[1]-yr[0]); } b.x+=(b.tx-b.x)*0.04; b.y+=(b.ty-b.y)*0.04; } }
function addMarks(W,side,k){ const now=performance.now(); for(let i=0;i<Math.min(k,14);i++){ const yr=side==='N'?[24,78]:[106,164]; W.marks.push({x:8+rnd()*300,y:yr[0]+rnd()*(yr[1]-yr[0]),t:now+rnd()*300}); } }
function drawSplit(W,o={}){
  const t=performance.now();
  px(0,0,320,88,'#bdf0d8'); px(0,96,320,84,'#ffe0cc');
  for(let i=0;i<40;i++){ px((i*67)%320,6+((i*31)%78),2,1,'#9fe0c2'); px((i*59+20)%320,100+((i*29)%76),2,1,'#f5c9ae'); }
  px(0,88,320,8,'#29adff'); for(let x=(t/60)%12-12;x<320;x+=12) px(x,91,5,1,'#9fe3ff'); px(146,86,28,12,'#ab5236'); for(let i=0;i<28;i+=4) px(146+i,86,2,12,'#8a3f22');
  [[250,6],[200,40],[96,6]].forEach(([x,y])=>house(x,y,'#00a050')); [[250,100],[200,128],[96,100]].forEach(([x,y])=>house(x,y,'#e8204e'));
  tt('NORTH',4,4,'#1d2b53',2); tt('SOUTH',4,166,'#1d2b53',2);
  const mood=o.mood||{};
  for(const r of W.N){ blob(r.x,r.y,'mint',{bob:t/330+r.ph}); }
  for(const r of W.S){ blob(r.x,r.y,'peach',{bob:t/330+r.ph}); }
  if(o.thoughts){ [0,3,6,9,13].forEach(i=>{ const r=W.N[i]; thought(r.x,r.y-14,'peach',mood.peach); }); [1,4,10,14].forEach(i=>{ const r=W.S[i]; thought(r.x,r.y-14,'mint',mood.mint); }); }
  W.marks=W.marks.filter(m=>t-m.t<2600); for(const m of W.marks){ if(t<m.t) continue; px(m.x,m.y,6,7,'#1d2b53'); px(m.x+1,m.y+1,4,5,'#fff8ef'); px(m.x+2,m.y+2,1,2,'#e8204e'); px(m.x+2,m.y+5,1,1,'#e8204e'); }
  for(const b of W.bots) bot(b.x,b.y,t);
  if(o.reveal){ if(o.reveal.N){ px(212,64,104,18,'#1d2b53'); tt('TRUE RATE 5%',264,70,'#ffec27',1,'center'); } if(o.reveal.S){ px(212,98,104,18,'#1d2b53'); tt('TRUE RATE 5%',264,104,'#ffec27',1,'center'); } }
  if(o.label) { px(110,0,100,12,'#1d2b53'); tt(o.label,160,4,'#ffec27',1,'center'); }
}

function patrolDay(sh,mode,checks=1000){ const cS=Math.round(checks*sh), cN=checks-cS; const rS=binom(cS,.05), rN=binom(cN,.05); let next=sh; const tot=rS+rN; if(tot>0){ if(mode==='rate'){ const a=cS?rS/cS:0, b=cN?rN/cN:0; next=(a+b)>0? (a*a)/(a*a+b*b):sh; next=0.5*sh+0.5*next; } else { const r=rS/tot; next = mode==='hot'? (r*r)/(r*r+(1-r)*(1-r)) : 0.5*sh+0.5*r; } } return {rS,rN,next:clamp(next,0,1)}; }
S({ch:1,
 title:{ko:'스스로를 증명하는 예측',zh:'自我证明的预测',en:'The Prediction That Proves Itself'},
 story:{ko:'마을이 <b>순찰봇 AI</b>를 들여옵니다. 매일 아침 어제 기록을 읽고 기록이 있는 곳으로 순찰을 보냅니다. 설정은 두 가지입니다. <b>비례</b>: 기록 비율 그대로 순찰을 나눈다. <b>핫스폿</b>: 기록이 많은 쪽에 순찰을 더 몰아준다.',
        zh:'小镇引进了<b>巡逻机器人AI</b>。它每天早上读取昨天的记录，把巡逻派到有记录的地方。有两种设置。<b>按比例</b>：按记录比例分配巡逻。<b>热点</b>：把更多巡逻集中到记录多的一边。',

 quiz:{q:{ko:'비례 모드에서 옛 60/40 배치는 끝내 바로잡히지 않았습니다. 왜인가요?',zh:'在“按比例”模式下，旧的60/40分配始终没有被纠正。为什么？',en:'In Proportional mode, the old 60/40 split never corrected itself. Why?'},
  opts:[{ko:'실제 발생률이 시간이 지나며 바뀌어서',zh:'真实发生率随时间改变了',en:'The true trouble rates changed over time'},{ko:'로봇이 남쪽을 우대하도록 짜여서',zh:'机器人被编程为偏向南边',en:'The bots were programmed to favor South'},{ko:'북쪽 주민들이 로봇을 피해 숨어서',zh:'北边居民躲着机器人',en:'North residents hid from the patrol bots'},{ko:'기록은 로봇이 본 곳만 보여 주므로',zh:'记录只反映查过的地方',en:'Records only show where the bots looked'}],a:3,
  why:{ko:'기록 비율은 순찰 비율을 그대로 따라갑니다. 시스템은 자기가 보지 않은 곳에 대해 배울 길이 없습니다.',zh:'记录比例完全跟着巡逻比例走。系统无从了解它没去看的地方。',en:'The record ratio simply mirrors the patrol ratio. The system has no way to learn about places it does not look.'}},
 key:{ko:'고리 속 숫자는 모두 진짜입니다. 그런데도 결론은 틀렸습니다. 비례 규칙은 옛 60/40 쏠림을 <b>고정</b>하고, 핫스폿 규칙은 그것을 <b>증폭</b>합니다. 시스템은 이미 보는 곳에서만 데이터를 모으므로, 데이터가 실수를 알려 줄 길이 없습니다.',zh:'循环里的每个数字都是真的，结论却是错的。按比例的规则把旧的60/40偏差<b>冻结</b>下来，热点规则则把它<b>放大</b>。系统只在已经在看的地方收集数据，所以数据永远无法告诉它自己错了。',en:'Every number in the loop is real, and the conclusion is still wrong. A proportional rule <b>freezes</b> the old 60/40 skew; a hotspot rule <b>amplifies</b> it. The system only collects data where it already looks, so the data can never show it the mistake.'}

  why:{ko:'순찰이 몰린 곳의 기록 → 클릭이 몰리는 헤드라인 → 한 집단의 사건만 보이는 피드. 거짓말은 없었습니다.',zh:'巡逻集中处的记录 → 吸引点击的头条 → 只看得到一个群体事件的信息流。整个过程没有一句谎话。',en:'Records from where patrols went → headlines that draw clicks → a feed that shows one group\'s incidents. No one lied.'}},

S({ch:1,
 title:{ko:'누가 그 광고를 골랐나?',zh:'是谁选了那条广告？',en:'Who Chose the Ad?'},
 story:{ko:'신원 조회 업체가 이름 검색에 광고를 겁니다. 업체는 <b>모든 이름에 똑같은 광고 문안 두 개</b>를 줍니다. <i>“솔라 찾기: 연락처”</i>와 <i>“솔라, 체포됨?”</i>. 버즈 검색은 50 대 50으로 시작해, <b>더 많이 클릭되는 문안을 더 자주</b> 보여 줍니다. 슬라이더는 남쪽에서 흔한 이름일 때만 ‘체포됨?’ 광고에 클릭을 조금 더 얹습니다.',

 task:{ko:'보너스 0으로 30라운드, 0보다 큰 보너스로 다시 30라운드를 실행하세요.',zh:'加成为0时运行30轮，再用大于0的加成运行30轮。',en:'Run 30 rounds with the bonus at 0, then again with a bonus above 0.'},

 ui(s,box){ box.appendChild(slider({ko:'남쪽 이름의 ‘체포됨?’ 광고에 더해지는 클릭률',zh:'南边名字的“被捕过？”广告额外点击率',en:'Extra click rate on “Arrested?” for South names'},0,1.5,.25,s.bias*100,v=>'+'+v.toFixed(2)+'%p',v=>s.bias=v/100,[{ko:'3.00% (차이 없음)',zh:'3.00%（无差别）',en:'3.00% (no gap)'},{ko:'4.50%',zh:'4.50%',en:'4.50%'}]));
  box.appendChild(row(btn({ko:'30라운드 실행',zh:'运行30轮',en:'Run 30 rounds'},()=>{ const bias=s.bias; s.ads={N:.5,S:.5}; s.round=0; const a={data:[50],color:'#3fa88a'}, b={data:[50],color:'#e8204e'}; s.series=[a,b]; play(30,110,()=>{ adRound(s.ads,bias); s.round++; a.data.push(Math.round(s.ads.N*100)); b.data.push(Math.round(s.ads.S*100)); },()=>{ const r={bias,N:s.ads.N,S:s.ads.S}; s.runs.push(r); if(bias>0){ PROG.data.ads={n:+(1-r.N).toFixed(2),s:+(1-r.S).toFixed(2),bias}; save(); } }); }))); },
 draw(s){ drawAds(s); },
 chart(s){ chartLine({series:s.series,xMax:30,xLabel:'ROUND',empty:'RUN TO SEE'}); legend([{color:'#3fa88a',label:{ko:'북쪽 이름 · ‘체포됨?’ 광고 비율',zh:'北边名字 ·“被捕过？”广告比例',en:'North names · share of “Arrested?” ad'}},{color:'#e8204e',label:{ko:'남쪽 이름 · ‘체포됨?’ 광고 비율',zh:'南边名字 ·“被捕过？”广告比例',en:'South names · share of “Arrested?” ad'}}]); },
 readout(s){ if(!s.runs.length) return ''; return `<div class="card">${s.runs.slice(-4).map(r=>`${L({ko:'보너스',zh:'加成',en:'bonus'})} +${(r.bias*100).toFixed(2)}%p → ${L({ko:'북',zh:'北',en:'N'})} <b>${Math.round(r.N*100)}%</b> · ${L({ko:'남',zh:'南',en:'S'})} <b>${Math.round(r.S*100)}%</b>`).join('<br>')}</div>`; },
 done(s){ return s.runs.some(r=>r.bias===0)&&s.runs.some(r=>r.bias>0); },
 quiz:{q:{ko:'남쪽 이름에 ‘체포됨?’ 광고를 더 자주 보여 주기로 정한 것은 누구인가요?',zh:'是谁决定对南边的名字更常显示“被捕过？”广告？',en:'Who decided to show the “Arrested?” ad more often for South names?'},
  opts:[{ko:'광고 문안을 직접 쓴 광고주',zh:'亲自写文案的广告主',en:'The advertiser, who wrote the ad text'},{ko:'차별 규칙을 코딩한 엔지니어',zh:'写了歧视规则的工程师',en:'The engineers, who coded a rule'},{ko:'아무도 아님(클릭이 가르침)',zh:'没有人——是点击教的',en:'Nobody; the clicks taught the system'},{ko:'검색을 더 많이 한 남쪽 주민',zh:'搜索更多的南边居民',en:'South residents, by searching more'}],a:2,
  why:{ko:'광고주는 모든 이름에 같은 문안을 줬고, 규칙은 ‘클릭 많은 쪽을 더 보여 준다’뿐이었습니다. 작은 클릭 차이가 쌓여 큰 격차가 되었습니다.',zh:'广告主给所有名字的文案都一样，规则也只是“哪条点击多就多显示”。微小的点击差异累积成了巨大的差距。',en:'The advertiser gave every name the same texts, and the rule was only “show more of what gets clicked.” A tiny click gap compounded into a large disparity.'}},
 key:{ko:'Sweeney(2013)는 흑인을 연상시키는 이름을 검색하면 체포를 암시하는 광고가 더 자주 뜬다는 것을 보였습니다. 그가 제시한 가능성 하나는 광고 시스템이 <b>사람들의 클릭에서 배웠다</b>는 것입니다. 그렇다면 아무도 누구를 겨냥하지 않았는데도 사회의 편견이 클릭을 타고 들어온 셈입니다. Sweeney는 신중했습니다. 원인이 무엇인지는 <i>아직 모른다</i>고 썼습니다.',zh:'Sweeney（2013）发现，搜索带有黑人联想的名字时，暗示被捕的广告出现得更频繁。她提出的一种可能是：广告系统<b>从人们的点击中学习</b>。若是如此，没有人刻意针对谁，社会偏见却通过点击进入了系统。Sweeney 很谨慎：她写道，究竟是什么原因，<i>我们还不知道</i>。',en:'Sweeney (2013) found that searches for Black-identifying names were more likely to show ads suggesting an arrest. One possibility she raised: the ad system <b>learned from people\'s clicks</b>. If so, no one targeted anyone, yet society\'s bias entered through the clicks. She was careful: which cause it was, she wrote, <i>we do not yet know</i>.'}
});

function adsData(){ if(PROG.data.ads) return PROG.data.ads; const st={N:.5,S:.5}; for(let i=0;i<30;i++) adRound(st,.01); return {n:+(1-st.N).toFixed(2),s:+(1-st.S).toFixed(2),bias:.01,fallback:true}; }
S({ch:1,
 title:{ko:'바깥에서 감사하기: 80% 규칙',zh:'从外部审计：80% 规则',en:'Audit from Outside: The 80% Rule'},
 story:{ko:'여러분은 버즈 검색의 코드를 볼 수 없습니다. Sweeney도 구글의 코드를 보지 못했습니다. 하지만 <b>결과</b>는 잴 수 있습니다. 미국 고용 지침에서 온 <b>80% 규칙</b>(5분의 4 규칙): 좋은 결과를 받은 비율이 <b>낮은</b> 집단의 값을 <b>높은</b> 집단의 값으로 나눕니다. 0.80 미만이면 불리 효과 가능성으로 표시합니다. 여기서 좋은 결과는 <b>중립 광고를 보는 것</b>입니다.',
        zh:'你看不到 Buzz 搜索的代码，Sweeney 也看不到谷歌的代码。但<b>结果</b>是可以测量的。源自美国就业指南的<b>80% 规则</b>（五分之四规则）：用获得好结果比例<b>较低</b>的群体的数值，除以<b>较高</b>群体的数值。低于0.80，就标记为可能存在不利影响。这里的好结果是<b>看到中性广告</b>。',
        en:'You cannot see Buzz Search\'s code; Sweeney could not see Google\'s either. But you can measure <b>outputs</b>. The <b>80% rule</b> (four-fifths rule), from U.S. employment guidelines: divide the <b>lower</b> group\'s rate of a good outcome by the <b>higher</b> group\'s rate. Below 0.80 → flag possible adverse impact. Here the good outcome is <b>seeing the neutral ad</b>.'},
 task:{ko:'12단계 결과로 비율을 계산해(소수 둘째 자리) 입력하세요.',zh:'用第12关的结果计算比值（保留两位小数）并输入。',en:'Compute the ratio from your Stage 12 results (two decimals) and enter it.'},
 init(s){ s.d=adsData(); s.ok=false; s.msg=''; },
 ui(s,box){ const d=s.d; const w=el('div','slider'); w.innerHTML=`<div><b>${L({ko:'중립 광고를 본 비율',zh:'看到中性广告的比例',en:'Rate of seeing the neutral ad'})}</b></div><div>🟢 ${L({ko:'북쪽 이름',zh:'北边名字',en:'North names'})}: <span class="big pix" style="font-size:12px">${d.n.toFixed(2)}</span> &nbsp; 🟠 ${L({ko:'남쪽 이름',zh:'南边名字',en:'South names'})}: <span class="big pix" style="font-size:12px">${d.s.toFixed(2)}</span></div>${d.fallback?`<small>${L({ko:'(12단계 기록이 없어 예시 값을 썼습니다)',zh:'（没有第12关的记录，使用示例数值）',en:'(No Stage 12 record found, so sample values are used)'})}</small>`:''}<div class="row" style="margin-top:8px"><span>${L({ko:'낮은 값 ÷ 높은 값 =',zh:'较低值 ÷ 较高值 =',en:'lower ÷ higher ='})}</span><input id="ratioIn" type="number" step="0.01" min="0" max="1" style="width:90px;font:inherit;border:3px solid #0b1030;padding:3px"></div>`; box.appendChild(w); box.appendChild(row(btn({ko:'확인',zh:'检查',en:'Check'},()=>{ let v=parseFloat(String(document.getElementById('ratioIn').value).replace(',','.')); if(v>1&&v<=100) v=v/100; const tr=Math.min(d.n,d.s)/Math.max(d.n,d.s); if(isNaN(v)){ s.msg=tx({ko:'숫자를 입력하세요.',zh:'请输入数字。',en:'Enter a number.'}); } else if(Math.abs(v-tr)<=0.015){ s.ok=true; s.ratio=+tr.toFixed(2); PROG.data.ratio=s.ratio; save(); s.msg=''; } else { s.msg=tx({ko:'계산을 다시 해 보세요. 낮은 값을 높은 값으로 나눕니다.',zh:'再算一遍：用较低值除以较高值。',en:'Try again: divide the lower value by the higher one.'}); } }))); },
 draw(s){ drawAds({ads:{N:1-s.d.n,S:1-s.d.s},round:30}); px(0,170,320,10,'#1d2b53'); tt(s.ok?('RATIO = '+s.ratio.toFixed(2)+(s.ratio<.8?'  < 0.80 FLAG!':'  >= 0.80')):'RATIO = ?',160,172,'#ffec27',1,'center'); },
 chart(s){ chartBars([{label:'NORTH',v:s.d.n*100,color:'#7fe0c0',text:s.d.n.toFixed(2)},{label:'SOUTH',v:s.d.s*100,color:'#ffb38a',text:s.d.s.toFixed(2)},{label:'RATIO',v:s.ok?s.ratio*100:0,color:s.ok&&s.ratio<.8?'#e8204e':'#00a050',text:s.ok?s.ratio.toFixed(2):'?'}],{hlines:[{v:80,color:'#e8204e',label:'0.80'}]}); legend([{color:'#7fe0c0',label:{ko:'북쪽 이름: 중립 광고 비율',zh:'北边名字：中性广告比例',en:'North names: neutral-ad rate'}},{color:'#ffb38a',label:{ko:'남쪽 이름: 중립 광고 비율',zh:'南边名字：中性广告比例',en:'South names: neutral-ad rate'}}]); },
 readout(s){ return s.msg?`<div class="card" style="background:#ffe3e8">${s.msg}</div>`:(s.ok?`<div class="card">${L({ko:'비율',zh:'比值',en:'Ratio'})} = <span class="big">${s.ratio.toFixed(2)}</span></div>`:''); },
 done(s){ return s.ok; },
 quiz:{q:{ko:'이 결과는 80% 규칙을 통과하나요?',zh:'这个结果通过80% 规则了吗？',en:'Does this result pass the 80% rule?'},
  opts:[{ko:'통과: 비율이 0.80 이상',zh:'通过：比值在0.80以上',en:'Pass: the ratio is 0.80 or higher'},{ko:'미달: 비율이 0.80 미만',zh:'未通过：比值低于0.80',en:'Fail: the ratio is less than 0.80'},{ko:'코드를 보지 않고는 알 수 없다',zh:'不看源代码就无法作出判断',en:"Can't tell without seeing the code"}],a:s=>(s.ratio>=.8?0:1),
  why:{ko:'규칙은 결과만 봅니다. 코드를 몰라도 판정할 수 있다는 것이 바깥 감사의 힘입니다.',zh:'这个规则只看结果。不看代码也能判断，这正是外部审计的力量。',en:'The rule looks only at outcomes. Being able to judge without the code is the power of an outside audit.'}},
 key:{ko:'바깥 감사에는 입력과 출력만 있으면 됩니다. 그래서 연구자가 <b>출력에 접근할 수 있는가</b>가 중요하고, 또 그래서 자주 다툼이 됩니다. (6주차 활동 THE DEFAULT SETTING에서 이 산식을 빌려 썼습니다.)',zh:'外部审计只需要输入和输出。因此研究者<b>能否获取输出</b>至关重要，也因此常常引发争议。（第6周课堂活动 THE DEFAULT SETTING 也借用了这个公式。）',en:'An outside audit needs only inputs and outputs. That is why <b>researcher access to outputs</b> matters, and why it is often contested. (Our Week 6 activity, THE DEFAULT SETTING, borrowed this formula.)'}
});

function amp(p,T){ const a=Math.pow(p,1/T), b=Math.pow(1-p,1/T); return a/(a+b); }
function dialT(d){ return 0.2+0.8*Math.pow(d,1.5); }
function makeArchive(){ const r=mulberry(279); const k=[...Array(100)].map((_,i)=>i<70?'mint':'peach'); for(let i=99;i>0;i--){ const j=Math.floor(r()*(i+1)); [k[i],k[j]]=[k[j],k[i]]; } return k.map((kind,i)=>({kind,x:10+(i%10)*15,y:20+Math.floor(i/10)*15.6,tx:0,ty:0})); }
function bot2(x,y,t){ // Buzz Draw robot with easel
  spr(["..OOOOO..",".OGGGGGO.","OGWGGGWGO","OGGGGGGGO","OGGRRRGGO",".OGGGGGO.","..OOOOO..","...O.O...","..OO.OO.."],x,y,{O:'#1d2b53',G:'#c2c3c7',W:'#29adff',R:'#ff77a8'},2);
  px(x+22,y+2,26,22,'#ab5236'); px(x+24,y+4,22,18,'#fff8ef'); px(x+26,y+24,2,8,'#ab5236'); px(x+42,y+24,2,8,'#ab5236'); const k=Math.floor(t/400)%2?'mint':'peach'; portrait(x+30,y+7,k,1);
}

S({ch:2,
 title:{ko:'오래된 사진 보관소',zh:'老照片档案馆',en:'The Old Photo Archive'},
 story:{ko:'버즈가 이미지 도구 <b>버즈 드로우</b>를 만듭니다. 이 도구는 마을 사진 보관소에서 ‘엔지니어’가 어떻게 생겼는지 배웁니다. 지난 50년간의 엔지니어 사진 100장입니다. 그 기간 대부분, 공대는 피치 주민을 거의 받지 않았습니다.',
        zh:'Buzz 正在开发图像工具 <b>Buzz Draw</b>。它从小镇照片档案馆学习“工程师”长什么样：过去50年的100张工程师照片。在那段时间的大部分时候，工学院几乎不招收蜜桃居民。',
        en:'Buzz is building an image tool, <b>Buzz Draw</b>. It learns what “an engineer” looks like from the town\'s photo archive: 100 photos of engineers from the past 50 years. For most of those years, engineering schools rarely admitted Peach folk.'},
 task:{ko:'보관소를 분류한 뒤 예측하세요.',zh:'先给档案分类，然后做预测。',en:'Sort the archive, then make a prediction.'},
 init(s){ s.A=makeArchive(); s.sorted=false; s.A.forEach(p=>{p.tx=p.x;p.ty=p.y;}); },
 ui(s,box){ box.appendChild(row(btn({ko:'보관소 분류하기',zh:'给档案分类',en:'Sort the archive'},()=>{ s.sorted=true; let m=0,p=0; s.A.forEach(o=>{ if(o.kind==='mint'){ o.tx=10+(m%7)*15; o.ty=20+Math.floor(m/7)*15.6; m++; } else { o.tx=128+(p%3)*15; o.ty=20+Math.floor(p/3)*15.6; p++; } }); }))); },
 tick(s){ s.A.forEach(o=>{ o.x+=(o.tx-o.x)*0.08; o.y+=(o.ty-o.y)*0.08; }); },
 draw(s){ px(0,0,320,180,'#2b2140'); px(0,0,320,14,'#1d2b53'); tt('TOWN PHOTO ARCHIVE: ENGINEERS 1975-2025',160,4,'#ffec27',1,'center'); for(let i=0;i<14;i++) px(i*23,170,20,10,'#3d2f5a'); s.A.forEach(o=>portrait(o.x,o.y,o.kind,1)); if(s.sorted){ px(186,30,126,60,'#1d2b53'); tt('MINT  70',249,40,'#7fe0c0',2,'center'); tt('PEACH 30',249,64,'#ffb38a',2,'center'); } bot2(196,108,performance.now()); },
 chart(s){ chartBars(s.sorted?[{label:'MINT',v:70,color:'#7fe0c0',text:'70%'},{label:'PEACH',v:30,color:'#ffb38a',text:'30%'}]:[{label:'?',v:0,color:'#ccc',text:'?'}]); legend([{color:'#7fe0c0',label:{ko:'보관소 속 민트 엔지니어',zh:'档案中的薄荷工程师',en:'Mint engineers in the archive'}},{color:'#ffb38a',label:{ko:'보관소 속 피치 엔지니어',zh:'档案中的蜜桃工程师',en:'Peach engineers in the archive'}}]); },
 done(s){ return s.sorted; },
 quiz:{type:'predict',q:{ko:'가장 안전한 설정에서 버즈 드로우에 ‘엔지니어’를 그려 달라고 하면, 민트는 몇 %일까요?',zh:'在最保守的设置下让 Buzz Draw 画“工程师”，薄荷居民会占多少？',en:'Asked for “an engineer” on its safest setting, what share of Buzz Draw\'s pictures will be Mint?'},
  opts:[{ko:'약 30%',zh:'约30%',en:'About 30%'},{ko:'약 50%',zh:'约50%',en:'About 50%'},{ko:'약 70%',zh:'约70%',en:'About 70%'},{ko:'70%보다 훨씬 많이',zh:'远超70%',en:'Well over 70%'}]},
 key:{ko:'데이터는 과거의 기록입니다. <b>누가 들어올 수 있었는지</b>까지 포함해서요. 그 기록으로 학습한 모델은 역사를 정의처럼 배웁니다.',zh:'数据是过去的记录，连<b>谁被允许进入</b>也记录在内。用这份记录训练的模型，会把历史当作定义来学习。',en:'Data are a record of the past, including <b>who was allowed in</b>. A model trained on that record learns history as if it were a definition.'}
});

function drawGen(s,head){ const t=performance.now(); px(0,0,320,180,'#2b2140'); px(0,0,320,14,'#1d2b53'); tt(head,160,4,'#ffec27',1,'center'); bot2(6,40,t);

S({ch:2,
 title:{ko:'기본값',zh:'默认值',en:'The Default Setting'},
 story:{ko:'버즈 드로우에는 <b>안전하게</b>부터 <b>모험적으로</b>까지 다이얼이 있습니다. 안전하게 그린다는 것은 <b>가장 전형적인</b> 엔지니어를 계속 그린다는 뜻입니다. 엔지니어 20명을 생성해 보관소와 비교하세요.',
        zh:'Buzz Draw 有一个从<b>保守</b>到<b>大胆</b>的旋钮。保守地画，就是一遍又一遍地画<b>最典型</b>的工程师。生成20位工程师，与档案比较。',
        en:'Buzz Draw has a dial from <b>Play it safe</b> to <b>Take risks</b>. Playing it safe means drawing the <b>most typical</b> engineer, over and over. Generate 20 engineers and compare with the archive.'},
 task:{ko:'다이얼을 왼쪽 끝(안전하게) 근처에서 한 번, 오른쪽 끝(모험적으로) 근처에서 한 번 생성하세요.',zh:'把旋钮放在最左（保守）附近生成一次，再放在最右（大胆）附近生成一次。',en:'Generate once near the left end (Play it safe) and once near the right end (Take risks).'},

S({ch:2,

S({ch:2,

function labRumor(f){ let bel=0,clk=0; const n=8; for(let i=0;i<n;i++){ const T=makeTown(); seedRumor(T); const P={w:f.acc?.3:1,posts:[POST.R,POST.C],base:.35,ramp:10,shareP:.45,repeat:true,friction:!!f.friction,pin:!!f.pin}; for(let d=0;d<8;d++) townDay(T,P); bel+=T.hist[T.hist.length-1].bel; clk+=Object.values(T.clicks).reduce((a,b)=>a+b,0); } return {bel:Math.round(bel/n),clk:Math.round(clk/n)}; }
function labPatrol(f){ let sh=f.reset?.5:.6; for(let d=0;d<20;d++) sh=patrolDay(sh,f.rate?'rate':'hot',20000).next; const ratio=Math.min(sh,1-sh)/Math.max(sh,1-sh); return {sh:Math.round(sh*100),ratio:+ratio.toFixed(2)}; }
function labGen(f){ const arch=f.rebal?.5:.7, T=f.full?1:.5, mix=f.noai?0:.6; let train=arch,out=arch; for(let g=0;g<6;g++){ out=amp(train,T); train=(1-mix)*arch+mix*out; } const ratio=Math.min(out,1-out)/Math.max(out,1-out); return {mint:Math.round(out*100),ratio:+ratio.toFixed(2)}; }

   <tr><td>${L({ko:'80% 규칙 비율(13단계)',zh:'80% 规则比值（第13关）',en:'80% rule ratio (Stage 13)'})}</td><td colspan="2">${PROG.data.ratio!=null?PROG.data.ratio.toFixed(2):'—'}</td></tr>
   ${lab?`<tr><td>${L({ko:'고치기 실험실',zh:'修复实验室',en:'Fix-It Lab'})}</td><td colspan="2">${fixNames(lab.f)||'—'}<br>${L({ko:'믿는 주민',zh:'相信的居民',en:'believers'})} ${lab.base.r.bel}% → ${lab.res.r.bel}% · ${L({ko:'순찰 비율',zh:'巡逻比值',en:'patrol ratio'})} ${lab.base.p.ratio} → ${lab.res.p.ratio} · ${L({ko:'그림 비율',zh:'图片比值',en:'picture ratio'})} ${lab.base.g.ratio} → ${lab.res.g.ratio}</td></tr>`:''}
  </table>
  <h3>${L({ko:'나의 답',zh:'我的回答',en:'My answers'})}</h3>
  <p><b>1.</b></p><div class="refl" id="r1"></div><p><b>2.</b></p><div class="refl" id="r2"></div>`;
  b.querySelector('#r1').textContent=PROG.refl[0]||''; b.querySelector('#r2').textContent=PROG.refl[1]||'';
  b.querySelector('#rName').oninput=e=>{ PROG.name=e.target.value; save(); }; b.querySelector('#rSid').oninput=e=>{ PROG.sid=e.target.value; save(); };
  b.querySelector('#cpBtn').onclick=async()=>{ const txt=reportText(); try{ await navigator.clipboard.writeText(txt); toast('COPIED!'); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('COPIED!');}catch(_){} ta.remove(); } };
  b.querySelector('#prBtn').onclick=()=>window.print(); b.querySelector('#clBtn').onclick=()=>ov.classList.remove('show');
  ov.classList.add('show'); }

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT=0;
function frame(t){ const st=STAGES[cur], s=ST[cur]; if(st&&s){ st.tick&&st.tick(s,t-lastT); G=SC; SC.clearRect(0,0,320,180); try{ st.draw(s,t); }catch(e){ console.error(e); } try{ st.chart&&st.chart(s); }catch(e){ console.error(e); } } lastT=t; requestAnimationFrame(frame); }
applyLang();
go(Math.min(maxUnlocked(),STAGES.length-1));
openTitle();
requestAnimationFrame(frame);
</script>
</body>
